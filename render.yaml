services:
  - type: web
    name: parykub
    branch: main
    runtime: static
    buildCommand: echo "No build required"
    staticPublishPath: .
    headers:
      - path: /movil.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /PartyKub-3d-table.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.json
        name: Cache-Control
        value: no-cache
      - path: /pwa-icon-192.png
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /pwa-icon-512.png
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /three.min.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /supabase.min.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /PartyKub-vertical-play-button.png
        name: Cache-Control
        value: public, max-age=31536000, immutable
